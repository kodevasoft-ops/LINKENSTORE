upstream django_api {
    least_conn;
    server web:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream django_ws {
    server ws:8001;
}

upstream flower {
    server flower:5555;
}

upstream nextjs_frontend {
    server frontend:3000;
}

# ── DESARROLLO LOCAL: un solo server en HTTP (puerto 80) ───────────────────
# NOTA: el bloque HTTPS (443) original requiere certificados reales de
# Let's Encrypt en /etc/letsencrypt/live/<dominio>/ que no existen en este
# entorno local. Cuando despliegues con un dominio real y certbot ya haya
# generado los certificados, puedes restaurar el bloque HTTPS + el redirect
# HTTP→HTTPS que tenías antes.
server {
    listen 80;
    server_name localhost 127.0.0.1;

    # ── Block bad actors ────────────────────────────────────────────────
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$) {
        return 405;
    }

    # ── Static files (Django) ───────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        limit_req zone=static burst=50 nodelay;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        limit_req zone=static burst=30 nodelay;
    }

    # ── Webhook Wompi — sin rate limit (firmado con checksum verificado en la app) ──
    location /api/v1/webhooks/wompi/ {
        proxy_pass         http://django_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Auth endpoints — rate limit estricto ────────────────────────────
    location ~ ^/api/v1/auth/(login|register)/ {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass         http://django_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── NextAuth (rutas propias del frontend, NO de Django) ─────────────
    location /api/auth/ {
        proxy_pass         http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API general ─────────────────────────────────────────────────────
    location /api/ {
        limit_req  zone=api burst=20 nodelay;
        limit_conn conn 20;
        limit_req_status 429;

        proxy_pass         http://django_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # ── WebSocket ───────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass          http://django_ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_read_timeout  3600s;
    }

    # ── Health check — sin rate limit ───────────────────────────────────
    location /health/ {
        proxy_pass http://django_api;
        access_log off;
    }

    # ── Django admin ───────────────────────────────────────────────────
    location /django-admin/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass         http://django_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Prometheus metrics — solo acceso interno/VPN ────────────────────
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://django_api;
        proxy_set_header Host $host;
    }

    # ── Flower Celery dashboard — solo acceso interno ───────────────────
    location /flower/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://flower/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Next.js frontend ────────────────────────────────────────────────
    location / {
        proxy_pass         http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── Nginx proxy cache para catálogo público ─────────────────────────────────
proxy_cache_path /var/cache/nginx/catalog levels=1:2 keys_zone=catalog_cache:10m max_size=100m inactive=60s;