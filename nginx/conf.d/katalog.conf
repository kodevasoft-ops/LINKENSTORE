upstream django_api {
    least_conn;
    server web:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream django_ws {
    server ws:8001;
}

upstream flower {
    server flower:5555;
}

upstream nextjs_frontend {
    server frontend:3000;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ${DOMAIN:-localhost};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN:-localhost}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN:-localhost}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Block bad actors ────────────────────────────────────────────────
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$) {
        return 405;
    }

    # ── Static files (Django) ───────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        limit_req zone=static burst=50 nodelay;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        limit_req zone=static burst=30 nodelay;
    }

    # ── Stripe webhook — sin rate limit (firmado por HMAC) ───────────────
    location /api/v1/webhooks/stripe/ {
        proxy_pass         http://django_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Auth endpoints — rate limit estricto ────────────────────────────
    location ~ ^/api/v1/auth/(login|register)/ {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass         http://django_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API general ─────────────────────────────────────────────────────
    location /api/ {
        limit_req  zone=api burst=20 nodelay;
        limit_conn conn 20;
        limit_req_status 429;

        proxy_pass         http://django_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # ── WebSocket ───────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass          http://django_ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_read_timeout  3600s;
    }

    # ── Health check — sin rate limit ───────────────────────────────────
    location /health/ {
        proxy_pass http://django_api;
        access_log off;
    }

    # ── Django admin ───────────────────────────────────────────────────
    location /django-admin/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass         http://django_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Next.js frontend ────────────────────────────────────────────────
    location / {
        proxy_pass         http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── Security headers avanzados ───────────────────────────────────────────────
add_header Content-Security-Policy
  "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https://api.stripe.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self';"
  always;
add_header Cross-Origin-Opener-Policy   "same-origin"             always;
add_header Cross-Origin-Resource-Policy "same-origin"             always;
add_header Cross-Origin-Embedder-Policy "require-corp"            always;

# ── Nginx proxy cache para catálogo público ─────────────────────────────────
proxy_cache_path /var/cache/nginx/catalog levels=1:2 keys_zone=catalog_cache:10m max_size=100m inactive=60s;


# ── Prometheus metrics — solo acceso interno/VPN ────────────────────────────
location /metrics {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://django_api;
    proxy_set_header Host $host;
}

# ── Flower Celery dashboard — solo acceso interno ───────────────────────────
location /flower/ {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://flower:5555/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
