version: "3.9"

x-env: &env
  DJANGO_SECRET_KEY:     ${DJANGO_SECRET_KEY}
  DEBUG:                 "False"
  ALLOWED_HOSTS:         ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  DB_NAME:               ${DB_NAME:-katalog}
  DB_USER:               ${DB_USER:-katalog_user}
  DB_PASSWORD:           ${DB_PASSWORD}
  DB_HOST:               pgbouncer
  DB_PORT:               "5432"
  REDIS_URL:             redis://redis:6379/0
  CELERY_BROKER_URL:     redis://redis:6379/3
  CELERY_RESULT_BACKEND: redis://redis:6379/4
  CORS_ORIGINS:          ${CORS_ORIGINS:-http://localhost:3000}
  STRIPE_SECRET_KEY:     ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  TNS_API_URL:           ${TNS_API_URL:-}
  TNS_API_KEY:           ${TNS_API_KEY:-}
  TNS_HMAC_SECRET:       ${TNS_HMAC_SECRET:-}
  FRONTEND_URL:          ${FRONTEND_URL:-http://localhost:3000}
  DEFAULT_FROM_EMAIL:    ${DEFAULT_FROM_EMAIL:-noreply@katalog.com}
  # S3 Media Storage
  AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_STORAGE_BUCKET:    ${AWS_STORAGE_BUCKET:-}
  AWS_S3_REGION:         ${AWS_S3_REGION:-us-east-1}
  # Sentry
  SENTRY_DSN:            ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-katalog}
      POSTGRES_USER:     ${DB_USER:-katalog_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=4MB
        -c maintenance_work_mem=128MB
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c log_min_duration_statement=200
        -c log_checkpoints=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-katalog_user} -d ${DB_NAME:-katalog}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G }
        reservations: { cpus: '0.5', memory: 512M }
    networks: [katalog]

  pgbouncer:
    image: bitnami/pgbouncer:latest
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST:               postgres
      POSTGRESQL_PORT:               5432
      POSTGRESQL_DATABASE:           ${DB_NAME:-katalog}
      POSTGRESQL_USERNAME:           ${DB_USER:-katalog_user}
      POSTGRESQL_PASSWORD:           ${DB_PASSWORD}
      PGBOUNCER_DATABASE:            ${DB_NAME:-katalog}
      PGBOUNCER_POOL_MODE:           transaction
      PGBOUNCER_MAX_CLIENT_CONN:     1000
      PGBOUNCER_DEFAULT_POOL_SIZE:   25
      PGBOUNCER_MIN_POOL_SIZE:       5
      PGBOUNCER_RESERVE_POOL_SIZE:   10
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
    depends_on:
      postgres: {condition: service_healthy}
    networks: [katalog]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --appendonly yes
        --appendfsync everysec
        --tcp-keepalive 300
        --timeout 0
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '1', memory: 768M }
    networks: [katalog]

  web:
    build: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn katalog.wsgi:application
               --bind 0.0.0.0:8000
               --workers 9
               --worker-class gthread
               --threads 4
               --timeout 60
               --graceful-timeout 30
               --keep-alive 5
               --max-requests 1000
               --max-requests-jitter 100
               --preload
               --access-logfile -
               --error-logfile -"
    environment: *env
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    expose: ["8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      pgbouncer: {condition: service_started}
      redis:     {condition: service_healthy}
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '2', memory: 1G }
        reservations: { cpus: '0.5', memory: 256M }
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
    networks: [katalog]

  ws:
    build: ./backend
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8001 --proxy-headers katalog.asgi:application
    environment: *env
    expose: ["8001"]
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }
    networks: [katalog]

  celery:
    build: ./backend
    restart: unless-stopped
    command: >
      celery -A katalog worker
        --loglevel=info
        --concurrency=8
        --max-tasks-per-child=500
        --max-memory-per-child=200000
        -Q default,celery,analytics,email
    environment: *env
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '2', memory: 1G }
    networks: [katalog]

  celery-beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A katalog beat --loglevel=info
    environment: *env
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    networks: [katalog]

  # ── Flower — Celery monitoring dashboard ──────────────────────────────────
  flower:
    build: ./backend
    restart: unless-stopped
    command: celery -A katalog flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
    environment: *env
    expose: ["5555"]
    depends_on: [redis]
    networks: [katalog]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx
    depends_on: [web, ws, frontend]
    deploy:
      resources:
        limits: { cpus: '1', memory: 256M }
    networks: [katalog]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL:           ${NEXT_PUBLIC_API_URL:-http://web:8000}
      NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      NEXTAUTH_SECRET:               ${NEXTAUTH_SECRET}
      NEXTAUTH_URL:                  ${NEXTAUTH_URL:-http://localhost:3000}
    expose: ["3000"]
    depends_on: [web]
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }
    networks: [katalog]

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  certbot_www:
  certbot_conf:
  nginx_cache:

networks:
  katalog:
    driver: bridge
